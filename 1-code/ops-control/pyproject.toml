[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-control"
version = "0.1.0"
description = "Offline-first G-lite operations control-plane contracts"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
  "webauthn==3.0.0",
]

[project.scripts]
ops = "ops.cli:main"
ops-approve = "ops.approval.server:main"

[tool.setuptools.packages.find]
include = ["ops*", "client*", "schema*"]

[tool.setuptools.package-data]
schema = ["*.json"]
