---
schema_version: 1
# Sanitized service index. No addresses, identity files, or production domains.
services:
  aether:
    old_dir: services/aether-ops
    lifecycle: primary_paused_standby_running
    facts_keys: [service_id, display_name, paused_at, pause_reason, last_verified, upgrade_profile, hosts, runtime, backup_relationship, operations, source_docs]
    hosts:
      - {lab_id: lab-global-primary, role: primary, runtime_status: stopped}
      - {lab_id: lab-global-ops, role: standby_public_entry, runtime_status: running}
      - {lab_id: lab-cn-1, role: warm_backup_receiver}
    notes: 用户于 2026-08-18 停 primary；standby 2026-08-27 已恢复。通用 release adapter 仍冻结。

  material_capture:
    old_dir: services/material-capture
    lifecycle: dormant
    hosts: []
    inventory_group: material_capture_hosts
    notes: 无承载主机；禁止静默迁入现有机。

  proxy_subscription:
    old_dir: services/proxy-subscription
    lifecycle: artifacts_only
    hosts:
      - {lab_id: lab-global-primary, role: artifact_publisher}
    production_entry: push-xui-nodes.yml
    approval_var: proxy_subscription_production_deploy_approved

  xui:
    old_dir: services/3x-ui
    lifecycle: production_subscription_live
    hosts:
      - {lab_id: lab-global-primary, role: primary, inventory_group: xui_hosts}

  xray_proxy:
    old_dir: services/xray-proxy
    hosts:
      - {lab_id: lab-global-ops, inventory_group: standard_proxy_hosts}
      - {lab_id: lab-global-proxy, inventory_group: standard_proxy_hosts}
      - {lab_id: lab-nat-1, inventory_group: nat_trial_hosts}

  sub2api:
    old_dir: services/sub2api
    status: active_local_only
    hosts:
      - {lab_id: lab-global-ops, role: local_api_gateway}

  bitwarden_lite:
    old_dir: services/bitwarden-lite
    hosts:
      - {lab_id: lab-global-ops, role: primary}

  bore:
    old_dir: services/bore
    hosts:
      - {lab_id: lab-global-primary, role: relay}

  grokbot:
    old_dir: services/grokbot
    hosts:
      - {lab_id: lab-unmanaged-pc, role: cloud_pc, managed: false}

  personal_asset_center:
    old_dir: services/personal-asset-center
    hosts:
      - {lab_id: lab-cn-1, bind: loopback}
    extra_tree: [tools, tests, archive]
    notes: 胶囊超出 facts/runbook/sources 最小集；未整目录复制。

  cloudflare:
    old_dir: services/cloudflare
    extra_tree: [accounts.json, scripts, expected-dns]
    notes: accounts.json 与优选资料未读未复制。

  chongzhi_art:
    old_dir: services/chongzhi-art
    lifecycle: backend_retired_caddy_retained
    hosts:
      - {lab_id: lab-global-ops}

  caddy:
    old_dir: services/caddy
    facts_only: true

  komari_agent:
    old_dir: services/komari-agent
    facts_only: true

  komari_server:
    old_dir: services/komari-server
    facts_only: true

  uptime_kuma:
    old_dir: services/uptime-kuma
    facts_only: true

  backup_dr:
    old_dir: null
    facts_source: external-sibling-module
    ansible_impl: ansible/roles/vps_backup
    blocked: true
    notes: 备份事实源已迁出 $OLD_VPS_ROOT；本轮不扩范围读取。
