---
id: global-proxy-only
host_id: lab-global-proxy
kind: server
machine_class: global_proxy_only
lifecycle: active
groups: [managed_linux, proxy_service_hosts, standard_proxy_hosts]
actions:
  - {action: service.deploy, service_id: svc-container-runtime, expect: deny}
  - {action: service.deploy, service_id: svc-ops-core, expect: deny}
  - {action: backup.run, expect: deny}
  - {action: host.baseline, expect: allow}
