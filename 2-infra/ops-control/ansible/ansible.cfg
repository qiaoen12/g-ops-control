[defaults]
inventory = inventories/lab/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
timeout = 20
forks = 5
interpreter_python = auto_silent
stdout_callback = default
deprecation_warnings = False

# 旧源 ansible.cfg 使用 host_key_checking=False、production hosts.ini、
# 以及 /tmp 下的 local_tmp/remote_tmp。本投影拒绝继承这三项。
# 本树默认不得连接真实主机；lab inventory 仅供离线结构与规则测试。

[ssh_connection]
pipelining = True
