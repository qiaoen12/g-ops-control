---
# 该文件只做控制端策略校验；它必须位于任何 adapter 调用和远端写任务之前。
- name: Validate every matched host against the registered policy
  ansible.builtin.assert:
    that:
      - >-
        (software_upgrade_policy.allowed_hosts | default([]) | length == 0)
        or item in (software_upgrade_policy.allowed_hosts | default([]))
      - >-
        (software_upgrade_policy.allowed_groups | default([]) | length == 0)
        or (
          (software_upgrade_policy.allowed_groups | default([]))
          | intersect(hostvars[item].group_names | default([]))
          | length > 0
        )
      - >-
        (
          (software_upgrade_policy.forbidden_groups | default([]))
          | intersect(hostvars[item].group_names | default([]))
          | length
        ) == 0
    fail_msg: >-
      software_id={{ software_id }} 的 policy 不允许目标 {{ item }}。
      allowed_hosts={{ software_upgrade_policy.allowed_hosts | default([]) }}；
      allowed_groups={{ software_upgrade_policy.allowed_groups | default([]) }}；
      forbidden_groups={{ software_upgrade_policy.forbidden_groups | default([]) }}；
      actual_groups={{ hostvars[item].group_names | default([]) }}。
  loop: "{{ ansible_play_hosts_all }}"
  loop_control:
    label: "{{ item }}"
  run_once: true

- name: Require explicit approval for policies that declare it
  ansible.builtin.assert:
    that:
      - >-
        software_operation_mode | default('check') != 'upgrade'
        or not (software_upgrade_policy.approval.required | default(false) | bool)
        or (
          lookup(
            'ansible.builtin.vars',
            software_upgrade_policy.approval.variable | default('software_upgrade_approved'),
            default=false
          ) | bool
        )
    fail_msg: >-
      software_id={{ software_id }} 需要显式批准变量
      {{ software_upgrade_policy.approval.variable | default('software_upgrade_approved') }}=true。
  run_once: true
