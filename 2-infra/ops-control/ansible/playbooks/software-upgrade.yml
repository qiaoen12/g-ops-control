---
# Sanitized projection: vars_files 指向 lab policy。
# 保留主备互斥、offload_targets 闸门、--limit、approval 与 adapter 存在性检查。
- name: Upgrade managed software through registered adapters
  hosts: all:!windows_home
  become: true
  gather_facts: false
  serial: 1
  vars_files:
    - ../inventories/lab/software-upgrade-policies.yml
  vars:
    force_parallel: false
    software_operation_mode: upgrade
  pre_tasks:
    - name: 要求通过 --limit 明确目标主机
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
        fail_msg: >-
          software-upgrade.yml 必须配合 --limit 使用。
          不要对全部主机执行受管软件升级。
      run_once: true

    - name: 校验 software_id 已提供且存在于 policy（在任何远端任务前）
      ansible.builtin.assert:
        that:
          - software_id is defined
          - software_id | length > 0
          - software_upgrade_policies is defined
          - software_id in software_upgrade_policies
        fail_msg: >-
          software_id={{ software_id | default('未提供') }} 没有升级策略。
          不要现场创建 role 或手写升级命令；先在
          inventories/lab/software-upgrade-policies.yml 中补齐 policy，
          并在对应 role 下新增 tasks/upgrade.yml。
      run_once: true

    - name: 固定当前软件升级策略（在任何远端任务前）
      ansible.builtin.set_fact:
        software_upgrade_policy: "{{ software_upgrade_policies[software_id] }}"

    - name: 在任何 adapter/远端写任务前校验软件目标和批准闸门
      ansible.builtin.include_tasks: tasks/validate-software-target.yml

    - name: 检查共享 private secrets 文件
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/private/all.secrets.yml"
      delegate_to: localhost
      become: false
      register: software_upgrade_all_private

    - name: 加载共享 private secrets
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/private/all.secrets.yml"
      when: software_upgrade_all_private.stat.exists

    - name: 检查主机 private secrets 文件
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/private/{{ inventory_hostname }}.secrets.yml"
      delegate_to: localhost
      become: false
      register: software_upgrade_host_private

    - name: 加载主机 private secrets
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/private/{{ inventory_hostname }}.secrets.yml"
      when: software_upgrade_host_private.stat.exists

    - name: 采集主机事实（adapter 可能需要 ansible_architecture 等）
      ansible.builtin.setup:
        gather_subset: min

    - name: 固定当前软件升级 adapter task
      ansible.builtin.set_fact:
        software_upgrade_adapter_tasks_from: >-
          {{ software_upgrade_policy.adapter_tasks_from | default('upgrade') }}

    - name: 校验 adapter role 配置
      ansible.builtin.assert:
        that:
          - software_upgrade_policy.adapter_role is defined
          - software_upgrade_policy.adapter_role | length > 0
          - software_upgrade_adapter_tasks_from is match('^[A-Za-z0-9_-]+$')
        fail_msg: >-
          software_id={{ software_id }} 的 policy 缺少 adapter_role。
          不要现场手写 adhoc 升级；先补齐 policy 和对应 role。
      run_once: true

    - name: 校验 adapter role upgrade task 存在
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../roles/{{ software_upgrade_policy.adapter_role }}/tasks/{{ software_upgrade_adapter_tasks_from }}.yml"
      delegate_to: localhost
      become: false
      register: software_upgrade_adapter_task
      run_once: true

    - name: 阻止调用缺失的 adapter
      ansible.builtin.assert:
        that:
          - software_upgrade_adapter_task.stat.exists
        fail_msg: >-
          software_id={{ software_id }} 对应的
          roles/{{ software_upgrade_policy.adapter_role }}/tasks/upgrade.yml 不存在。
          不要现场创建临时升级命令；先为该软件补齐受管 adapter。
      run_once: true

    - name: 校验该软件允许自动升级
      ansible.builtin.assert:
        that:
          - software_upgrade_policy.auto_upgrade_allowed | default(false) | bool
        fail_msg: >-
          software_id={{ software_id }} 的 auto_upgrade_allowed 不是 true。
          当前只允许 check 或人工指定的专用 playbook，不允许通用入口自动升级。
      run_once: true

    - name: 阻止同一次调用同时升级 primary 和 standby
      ansible.builtin.assert:
        that:
          - >-
            not (
              software_upgrade_policy.rollout.fail_on_mixed_roles_without_force | default(false) | bool
              and not (force_parallel | bool)
              and (
                ansible_play_hosts_all
                | intersect(groups[software_upgrade_policy.rollout.role_groups.primary] | default([]))
                | length
              ) > 0
              and (
                ansible_play_hosts_all
                | intersect(groups[software_upgrade_policy.rollout.role_groups.standby] | default([]))
                | length
              ) > 0
            )
        fail_msg: >-
          software_id={{ software_id }} 本次目标同时包含 primary 和 standby。
          policy 要求 sequential/max_parallel=1；请分批执行，或在明确承担风险时设置
          -e force_parallel=true。
      when:
        - software_upgrade_policy.rollout is defined
        - software_upgrade_policy.rollout.role_groups is defined
        - software_upgrade_policy.rollout.role_groups.primary is defined
        - software_upgrade_policy.rollout.role_groups.standby is defined
      run_once: true

    - name: 校验 offload 目标必须有 offload policy
      ansible.builtin.assert:
        that:
          - >-
            inventory_hostname not in (groups['offload_targets'] | default([]))
            or software_upgrade_policy.offload_policy is defined
          - >-
            inventory_hostname not in (groups['offload_targets'] | default([]))
            or software_upgrade_policy.offload_policy.relay_host is defined
          - >-
            inventory_hostname not in (groups['offload_targets'] | default([]))
            or software_upgrade_policy.offload_policy.relay_playbook is defined
        fail_msg: >-
          {{ inventory_hostname }} 属于 offload_targets，但 software_id={{ software_id }}
          缺少 offload_policy。不要让国内目标主机直接访问外网源；先补齐 offload
          adapter 或使用专用 offload playbook。

  tasks:
    - name: 通过受管 adapter 执行升级并释放并发锁
      block:
        - name: 获取同主机升级锁
          ansible.builtin.command: "mkdir {{ software_upgrade_policy.concurrency.lock_path | default('/var/lock/ops-software-upgrade.lockdir') }}"
          register: software_upgrade_lock_acquire
          changed_when: software_upgrade_lock_acquire.rc == 0
          failed_when: false

        - name: 阻止并发升级
          ansible.builtin.assert:
            that:
              - software_upgrade_lock_acquire.rc == 0
            fail_msg: >-
              {{ inventory_hostname }} 已存在升级锁
              {{ software_upgrade_policy.concurrency.lock_path | default('/var/lock/ops-software-upgrade.lockdir') }}。
              若确认没有升级任务在运行，可人工清理该锁目录后重试。

        - name: 调用软件 adapter role
          ansible.builtin.include_role:
            name: "{{ software_upgrade_policy.adapter_role }}"
            tasks_from: "{{ software_upgrade_adapter_tasks_from }}"
      always:
        - name: 释放同主机升级锁
          ansible.builtin.file:
            path: "{{ software_upgrade_policy.concurrency.lock_path | default('/var/lock/ops-software-upgrade.lockdir') }}"
            state: absent
          when:
            - software_upgrade_lock_acquire is defined
            - software_upgrade_lock_acquire.rc == 0
