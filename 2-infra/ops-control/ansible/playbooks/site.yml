---
# Sanitized projection of the frozen aggregate entry.
# Old source fail_msg named production short-ids; this copy uses group names.
- name: Deprecated aggregate entry – fail before connecting
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Stop use of the unsafe aggregate entry
      ansible.builtin.assert:
        that: false
        fail_msg: >-
          site.yml 已冻结，禁止作为总入口执行。请按职责选择精确 playbook，
          并显式使用 --limit；nat_trial_hosts、xui_hosts 和暂停的 Aether
          不得通过历史聚合入口触达。
