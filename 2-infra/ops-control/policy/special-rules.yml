---
schema_version: 1
# Machine-checkable special rules. Inputs use fictional lab host/service/software IDs.
# expect is allow or deny. Evaluator is deny-wins across all matches.
# owner_issue is the follow-up task, not enabled status.
rules:
  - id: aether-primary-paused
    source: services/ops-core/facts.yml paused_at/pause_reason; host runtime_status=stopped
    when: {host_id: lab-global-primary, action: service.start, service_id: svc-ops-core}
    expect: deny
    owner_issue: OPS-011
    correction: 外部 OPS-001 把整栈写成暂停；旧 facts 仅 primary 停止，standby 已于 2026-08-27 恢复。

  - id: aether-release-frozen
    source: software-upgrade-policies.yml aether.auto_upgrade_allowed=false; playbooks/upgrade-ops-core-release.yml
    when: {action: software.update, software_id: sw-ops-core}
    expect: deny
    owner_issue: OPS-009
    note: 薄壳 playbook 在旧源仍可直接跑 role，未像 site.yml 那样 assert false。承接时必须冻结。本规则不匹配 sw-dual-role，避免遮蔽主备互斥。

  - id: aether-standby-running
    source: services/ops-core/facts.yml hosts[standby].runtime_status=running
    when: {host_id: lab-global-ops, action: software.check, software_id: sw-ops-core-candidate, ledger_vs_facts: consistent}
    expect: allow
    owner_issue: OPS-009
    note: 仅在 ledger 与 facts 一致时允许。冲突见 ledger-facts-conflict-reject。

  - id: ledger-facts-conflict-reject
    source: lab-ledger.yml service_state vs services/ops-core/facts.yml runtime_status
    when: {host_id: lab-global-ops, ledger_vs_facts: conflict, software_id: sw-ops-core}
    expect: deny
    owner_issue: OPS-011
    note: standby facts=running 且 ledger=paused_by_user。冲突未和解前拒绝该软件目标，不静默采用任一侧。

  - id: ledger-facts-conflict-reject-candidate
    source: lab-ledger.yml vs services/ops-core/facts.yml
    when: {host_id: lab-global-ops, ledger_vs_facts: conflict, software_id: sw-ops-core-candidate}
    expect: deny
    owner_issue: OPS-009
    note: candidate 不得因 consistent→allow 规则在冲突时落到 None；冲突未和解前必须 deny。

  - id: ledger-facts-conflict-reject-service
    source: lab-ledger.yml vs services/ops-core/facts.yml
    when: {host_id: lab-global-ops, ledger_vs_facts: conflict, service_id: svc-ops-core}
    expect: deny
    owner_issue: OPS-011

  - id: primary-standby-mutex
    source: software-upgrade.yml fail_on_mixed_roles_without_force
    when: {action: software.update, software_id: sw-dual-role, mixed_roles: true, force_parallel: false}
    expect: deny
    owner_issue: OPS-007
    note: 用虚构 sw-dual-role 证明互斥；不得依赖 sw-ops-core 的 release freeze。

  - id: primary-standby-force-parallel
    source: software-upgrade.yml force_parallel=true escape hatch
    when: {action: software.update, software_id: sw-dual-role, mixed_roles: true, force_parallel: true}
    expect: allow
    owner_issue: OPS-007
    note: 旧入口允许显式 force_parallel；默认仍 deny。

  - id: nat-no-full-baseline
    source: machine-class-baseline.md; baseline.yml hosts managed_linux:!nat_trial_hosts
    when: {machine_class: nat_trial, action: host.baseline}
    expect: deny
    owner_issue: OPS-011

  - id: nat-no-docker
    source: machine-class-baseline.md NAT 禁止 Docker / 业务容器
    when: {machine_class: nat_trial, action: service.deploy, service_id: svc-container-runtime}
    expect: deny
    owner_issue: OPS-011

  - id: nat-no-ssh-access
    source: ssh-access.yml hosts managed_linux:!nat_trial_hosts
    when: {machine_class: nat_trial, action: host.ssh-access}
    expect: deny
    owner_issue: OPS-011

  - id: nat-no-vps-ops
    source: ops-task.yml NAT reject; checks/AGENTS.md
    when: {machine_class: nat_trial, action: diagnostics.nodequality}
    expect: deny
    owner_issue: OPS-011

  - id: nat-no-generic-komari
    source: apply-komari-agent-config.yml excludes nat_trial_hosts
    when: {machine_class: nat_trial, action: service.deploy, service_id: svc-monitor-agent, entry: generic}
    expect: deny
    owner_issue: OPS-011

  - id: nat-agent-unapproved
    source: deploy-nat-trial-komari-agent.yml requires dedicated authorization
    when: {machine_class: nat_trial, action: service.deploy, service_id: svc-monitor-agent, entry: nat-dedicated, approved: false}
    expect: deny
    owner_issue: OPS-011
    note: 未授权必须 deny。evaluate 将缺失的 approved 视为 false。

  - id: nat-agent-separate-auth
    source: deploy-nat-trial-komari-agent.yml
    when: {machine_class: nat_trial, action: service.deploy, service_id: svc-monitor-agent, entry: nat-dedicated, approved: true}
    expect: allow
    owner_issue: OPS-011

  - id: nat-proxy-dedicated
    source: deploy-nat-trial-proxy.yml; deploy-proxy.yml rejects nat_trial_hosts
    when: {machine_class: nat_trial, action: service.deploy, service_id: svc-edge-proxy, entry: standard-proxy}
    expect: deny
    owner_issue: OPS-011

  - id: retired-not-confused-with-successor
    source: lab-ledger.yml distinct keys for retired predecessor vs active successor
    when: {host_id: lab-retired-vmiss, action: any}
    expect: deny
    owner_issue: OPS-011

  - id: retired-no-resurrect
    source: ledger status=retired for lab-retired-4 and empty cpa/nezha groups
    when: {lifecycle: retired, action: service.deploy}
    expect: deny
    owner_issue: OPS-011

  - id: material-capture-dormant
    source: services/material-capture/facts.yml lifecycle=dormant; empty material_capture_hosts
    when: {action: service.deploy, service_id: svc-capture-idle}
    expect: deny
    owner_issue: OPS-011

  - id: mainland-no-proxy-egress
    source: machine-class-baseline.md 大陆机不做代理节点
    when: {machine_class: mainland, action: service.deploy, service_id: svc-edge-proxy}
    expect: deny
    owner_issue: OPS-011

  - id: offload-required
    source: AGENTS.md; software-upgrade.yml offload_targets assert; offload playbooks
    when: {machine_class: mainland, action: software.update, fetches_overseas: true, via_offload: false}
    expect: deny
    owner_issue: OPS-009

  - id: offload-ok
    source: offload-url-to-lab-cn.yml; software-upgrade.yml offload_policy
    when: {machine_class: mainland, action: software.update, fetches_overseas: true, via_offload: true}
    expect: allow
    owner_issue: OPS-009

  - id: no-old-object-storage-restore
    source: root AGENTS.md — 不再维护旧对象存储拉取或恢复 playbook
    when: {host_id: lab-cn-1, action: backup.restore, backend: legacy-object-storage}
    expect: deny
    owner_issue: OPS-010

  - id: proxy-subscription-approval
    source: push-xui-nodes.yml proxy_subscription_production_deploy_approved
    when: {action: service.configure, service_id: svc-node-catalog, approved: false}
    expect: deny
    owner_issue: OPS-011

  - id: no-aggregate-site
    source: playbooks/site.yml assert false
    when: {action: site.aggregate}
    expect: deny
    owner_issue: OPS-011

  - id: xui-not-standard-proxy
    source: deploy-proxy.yml rejects xui_hosts
    when: {groups_contains: xui_hosts, action: service.deploy, service_id: svc-edge-proxy, entry: standard-proxy}
    expect: deny
    owner_issue: OPS-011

  - id: global-proxy-only-no-docker-backup-aether
    source: machine-class-baseline.md proxy-only class
    when: {machine_class: global_proxy_only, action: service.deploy, service_id: svc-container-runtime}
    expect: deny
    owner_issue: OPS-011

  - id: global-proxy-only-no-ops-core
    source: machine-class-baseline.md 全球只做代理
    when: {machine_class: global_proxy_only, action: service.deploy, service_id: svc-ops-core}
    expect: deny
    owner_issue: OPS-011

  - id: global-proxy-only-no-backup
    source: machine-class-baseline.md 全球只做代理，不进 backup_sources
    when: {machine_class: global_proxy_only, action: backup.run}
    expect: deny
    owner_issue: OPS-010

  - id: paused-service-not-auto-start
    source: PRD F2/F5; aether primary paused
    when: {service_expected: paused, action: service.start}
    expect: deny
    owner_issue: OPS-011

  - id: unmanaged-not-in-inventory
    source: services/local-client/facts.yml managed=false
    when: {kind: local_client, action: ansible.limit}
    expect: deny
    owner_issue: OPS-011

  - id: unmanaged-no-managed-deploy
    source: services/local-client/facts.yml 不进 inventory，不跑 deploy-monitoring / komari_agent role
    when: {kind: local_client, action: service.deploy}
    expect: deny
    owner_issue: OPS-011

  - id: windows-not-linux-class
    source: machine-class-baseline.md 「Windows 主机不在这三类里」
    when: {machine_class: windows_home, action: host.baseline, baseline: linux}
    expect: deny
    owner_issue: OPS-011

  - id: windows-baseline-ok
    source: deploy-windows-lab-baseline.yml hosts windows_home
    when: {machine_class: windows_home, action: host.baseline, baseline: windows}
    expect: allow
    owner_issue: OPS-011

  - id: irreversible-purge
    source: purge-vaultwarden.yml
    when: {action: purge.data}
    expect: deny
    owner_issue: OPS-012

  - id: bootstrap-nat-gap
    source: bootstrap.yml hosts managed_linux without !nat_trial_hosts
    when: {machine_class: nat_trial, action: host.bootstrap}
    expect: deny
    owner_issue: OPS-011
    note: 旧入口尚未排除 NAT；承接时按 NAT 禁令拒绝，不复制这个缺口。

  - id: global-linux-baseline-ok
    source: baseline.yml hosts managed_linux:!nat_trial_hosts
    when: {machine_class: global, action: host.baseline}
    expect: allow
    owner_issue: OPS-011

  - id: global-proxy-only-baseline-ok
    source: baseline.yml hosts managed_linux:!nat_trial_hosts; machine-class 第五节仍跑共享基线
    when: {machine_class: global_proxy_only, action: host.baseline}
    expect: allow
    owner_issue: OPS-011

  - id: mainland-baseline-ok
    source: baseline.yml; deploy-domestic-baseline.yml
    when: {machine_class: mainland, action: host.baseline}
    expect: allow
    owner_issue: OPS-011

  - id: global-nodequality-ok
    source: ops-task.yml allowlisted nodequality; checks/AGENTS.md
    when: {machine_class: global, action: diagnostics.nodequality}
    expect: allow
    owner_issue: OPS-011
